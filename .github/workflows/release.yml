name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag and package version
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref_name }}' -ne $expected) { throw "Release tag must be $expected" }
      - run: npm ci
      - run: node --check app.js
      - run: node tests/test_import_stage.cjs
      - run: node tests/test_financials.cjs
      - run: node tests/test_receipts.cjs
      - run: node tests/test_bank_accounts.cjs
      - run: node tests/test_dynamic_sync.cjs
      - run: node tests/test_tracker_and_nav.cjs
      - run: node tests/test_meowsheet_rebrand.cjs
      - run: node tests/test_row_copy_paste_move.cjs
      - run: node tests/test_row_delete_undo_redo.cjs
      - run: node tests/test_cat_reactions.cjs
      - run: node tests/test_smart_notifications.cjs
      - run: python tests/test_import.py
      - run: npm run build:win
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $base = "release/MeowSheet-$version-Setup.exe"
          $assets = @($base, "$base.blockmap", 'release/latest.yml')
          foreach ($asset in $assets) { if (!(Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" } }
          gh release create '${{ github.ref_name }}' @assets --verify-tag --title 'MeowSheet ${{ github.ref_name }}' --notes 'MeowSheet ${{ github.ref_name }}: Auto-refresh expired Supabase JWT session and prune orphaned pending sync items.'

name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check tag and package version
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref_name }}' -ne $expected) { throw "Release tag must be $expected" }
      - run: npm ci
      - run: node --check app.js
      - run: node tests/test_import_stage.cjs
      - run: node tests/test_financials.cjs
      - run: npm run build:win
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $base = "release/GIR-Studio-Desk-$version-Setup.exe"
          $assets = @($base, "$base.blockmap", 'release/latest.yml')
          foreach ($asset in $assets) { if (!(Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" } }
          gh release create '${{ github.ref_name }}' @assets --verify-tag --title 'GIR Studio Desk ${{ github.ref_name }}' --notes 'Windows installer with in-app updates from GitHub Releases.'

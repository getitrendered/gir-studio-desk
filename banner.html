<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MeowSheet Banner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 8px;
    }
    .banner-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: rgba(24, 27, 38, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid #f59e0b;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), 0 2px 10px rgba(245, 158, 11, 0.3);
      color: #f8fafc;
      cursor: pointer;
      transform: translateY(-130%);
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
      position: relative;
    }
    .banner-card.banner-black {
      border-color: #a855f7;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), 0 2px 10px rgba(168, 85, 247, 0.35);
    }
    .banner-card.visible {
      transform: translateY(0);
      opacity: 1;
    }
    .banner-card.hiding {
      transform: translateY(-130%);
      opacity: 0;
    }
    .banner-icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }
    .banner-icon img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }
    .banner-content {
      flex: 1;
      min-width: 0;
      padding-right: 18px;
    }
    .banner-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .banner-body {
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .banner-close {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #94a3b8;
      font-size: 15px;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .banner-close:hover {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="banner-card" id="card">
    <div class="banner-icon" id="iconBox">
      <img src="assets/gir-icon.png" id="iconImg" alt="Icon">
    </div>
    <div class="banner-content">
      <div class="banner-title" id="titleText">MeowSheet</div>
      <div class="banner-body" id="bodyText">Notification</div>
    </div>
    <button type="button" class="banner-close" id="closeBtn" title="Dismiss">&times;</button>
  </div>
  <script>
    const card = document.getElementById('card');
    const iconImg = document.getElementById('iconImg');
    const titleText = document.getElementById('titleText');
    const bodyText = document.getElementById('bodyText');
    const closeBtn = document.getElementById('closeBtn');

    if (window.desk?.onDisplayBanner) {
      window.desk.onDisplayBanner((data) => {
        titleText.textContent = data.title || 'MeowSheet';
        bodyText.textContent = data.body || '';

        const catPayload = data.catPayload;
        if (catPayload && catPayload.catType === 'black') {
          card.classList.add('banner-black');
        } else {
          card.classList.remove('banner-black');
        }

        if (catPayload && catPayload.reactionKey) {
          const color = catPayload.catType === 'black' ? 'black' : 'orange';
          iconImg.src = `assets/cats/${color}/${catPayload.reactionKey}.webp`;
        } else {
          iconImg.src = 'assets/gir-icon.png';
        }

        card.classList.remove('hiding');
        requestAnimationFrame(() => {
          card.classList.add('visible');
        });
      });
    }

    if (window.desk?.onHideBanner) {
      window.desk.onHideBanner(() => {
        card.classList.remove('visible');
        card.classList.add('hiding');
      });
    }

    card.addEventListener('click', (e) => {
      if (e.target === closeBtn || closeBtn.contains(e.target)) return;
      if (window.desk?.focusApp) {
        window.desk.focusApp();
      }
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      card.classList.remove('visible');
      card.classList.add('hiding');
      setTimeout(() => {
        if (window.desk?.hideBanner) window.desk.hideBanner();
      }, 300);
    });
  </script>
</body>
</html>

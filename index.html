<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeowSheet</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="extras.css"></head>
<body>
<div id="app">
  <div class="center">
    <div class="tabs-header" id="tabsHeader">
      <div class="tabs-nav" id="tabsNav"><img src="assets/gir-icon.png" alt="MeowSheet Logo" class="top-app-logo"><button type="button" id="topBackBtn" class="top-back-btn" title="Back to previous view" disabled><svg viewBox="0 0 16 16" width="12" height="12" fill="none"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Back</span></button></div>
      <div class="tabs" id="tabs"><button data-tab="sheet" class="active">Worksheet</button><button data-tab="dashboard">Dashboard</button><button data-tab="tracker">Work Tracker</button><button data-tab="chat">Chat <span class="tab-badge" id="chatUnreadCount" style="display:none">0</span></button><button data-tab="groups">Groups</button><button data-tab="revenue">Revenue</button><button data-tab="payments">Payments</button><button data-tab="invoices">Invoices</button><button data-tab="client-details">Client Details</button><button data-tab="settings">Settings</button><span class="tab-indicator" id="tabIndicator"></span></div>
      <div class="tabs-sync" id="tabsSync"><button type="button" id="topSyncBtn" class="top-sync-btn" title="Click to refresh / sync"><svg class="sync-icon" viewBox="0 0 16 16" width="13" height="13" fill="none"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9L14 6m0-4.5V6h-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="topSyncText">Synced just now</span></button></div>
    </div>
    <main id="main"></main>
    <div class="client-tabs"><div id="clientList" class="client-tab-list"></div><button id="newClientBtn" class="new-client-tab" title="New client" aria-label="New client">＋</button></div>
  </div>
</div>
<div id="modalRoot"></div><div id="toast"></div>
<script src="vendor/supabase.js"></script><script src="vendor/lottie.min.js"></script><script src="app.js"></script>
</body></html>
